<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#111827">Squad AI · delivery flow</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">One human. Planning agents, an orchestrator, a dev and a verifier. Guards enforce what instructions cannot.</text>

  <!-- HUMAN lane -->
  <rect x="40" y="100" width="1320" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="128" font-size="15" font-weight="700" fill="#92400e">YOU — product owner · tech lead · release manager</text>
  <g font-size="13" fill="#78350f">
    <rect x="60" y="142" width="200" height="34" rx="8" fill="#fde68a"/><text x="72" y="164">Approve PRD &amp; architecture</text>
    <rect x="280" y="142" width="200" height="34" rx="8" fill="#fde68a"/><text x="292" y="164">Order tickets · mark hitl</text>
    <rect x="500" y="142" width="200" height="34" rx="8" fill="#fde68a"/><text x="512" y="164">Answer blocked tickets</text>
    <rect x="720" y="142" width="200" height="34" rx="8" fill="#fde68a"/><text x="732" y="164">Review hitl PRs (Plannotator)</text>
    <rect x="940" y="142" width="200" height="34" rx="8" fill="#fde68a"/><text x="952" y="164">Merge the Release PR</text>
    <rect x="1160" y="142" width="180" height="34" rx="8" fill="#fde68a"/><text x="1172" y="164">Phone: start · approve</text>
  </g>

  <!-- PLANNING lane -->
  <rect x="40" y="220" width="1320" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="248" font-size="15" font-weight="700" fill="#3730a3">PLANNING — interactive, BMAD v7 skills</text>
  <g font-size="13" fill="#1e1b4b">
    <rect x="60" y="268" width="150" height="56" rx="8" fill="#c7d2fe"/><text x="72" y="291" font-weight="600">Brief</text><text x="72" y="310">bmad-product-brief</text>
    <rect x="240" y="268" width="150" height="56" rx="8" fill="#c7d2fe"/><text x="252" y="291" font-weight="600">PRD</text><text x="252" y="310">bmad-prd</text>
    <rect x="420" y="268" width="150" height="56" rx="8" fill="#c7d2fe"/><text x="432" y="291" font-weight="600">UX (optional)</text><text x="432" y="310">bmad-ux</text>
    <rect x="600" y="268" width="150" height="56" rx="8" fill="#c7d2fe"/><text x="612" y="291" font-weight="600">Architecture</text><text x="612" y="310">bmad-architecture</text>
    <rect x="780" y="268" width="170" height="56" rx="8" fill="#c7d2fe"/><text x="792" y="291" font-weight="600">Epics &amp; tickets</text><text x="792" y="310">bmad-agent-po → tickets.toml</text>
    <rect x="1000" y="268" width="340" height="56" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-dasharray="4 3"/><text x="1012" y="291" font-weight="600">GitHub Issues + Projects board</text><text x="1012" y="310">one issue per ticket · columns = states</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="296" x2="238" y2="296"/><line x1="390" y1="296" x2="418" y2="296"/><line x1="570" y1="296" x2="598" y2="296"/><line x1="750" y1="296" x2="778" y2="296"/><line x1="950" y1="296" x2="998" y2="296"/>
  </g>

  <!-- DELIVERY lane -->
  <rect x="40" y="380" width="1320" height="360" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="408" font-size="15" font-weight="700" fill="#065f46">DELIVERY — autonomous, started with /squad-run</text>

  <!-- orchestrator -->
  <rect x="60" y="430" width="230" height="130" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="456" font-size="14" font-weight="700" fill="#064e3b">Orchestrator (Opus)</text>
  <g font-size="12" fill="#065f46">
    <text x="76" y="478">• next ticket with after-deps done</text>
    <text x="76" y="496">• picks model &amp; effort per ticket</text>
    <text x="76" y="514">• sequential by default</text>
    <text x="76" y="532">• retries, blocks, auto-merge</text>
    <text x="76" y="550">• never writes code</text>
  </g>

  <!-- dev -->
  <rect x="350" y="430" width="250" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="366" y="456" font-size="14" font-weight="700" fill="#1e3a8a">Dev (Sonnet, worktree)</text>
  <g font-size="12" fill="#1e40af">
    <text x="366" y="478">• reads ticket + conventions</text>
    <text x="366" y="496">• Context7 for library APIs</text>
    <text x="366" y="514">• code + tests → quality green</text>
    <text x="366" y="532">• conventional commit → push → PR</text>
    <text x="366" y="550">• never asks; returns blocked</text>
  </g>

  <!-- verifier -->
  <rect x="660" y="430" width="270" height="130" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="676" y="456" font-size="14" font-weight="700" fill="#831843">Verifier (fresh context)</text>
  <g font-size="12" fill="#9d174d">
    <text x="676" y="478">• reviews diff vs ticket &amp; conventions</text>
    <text x="676" y="496">• builds test artifact</text>
    <text x="676" y="514">• runs Verify steps on emulator</text>
    <text x="676" y="532">• screenshots, logs → evidence</text>
    <text x="676" y="550">• verdict JSON → check run "verifier"</text>
  </g>

  <!-- merge -->
  <rect x="990" y="430" width="350" height="130" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1006" y="456" font-size="14" font-weight="700" fill="#064e3b">GitHub gate</text>
  <g font-size="12" fill="#065f46">
    <text x="1006" y="478">required checks: CI · secret scan · verifier</text>
    <text x="1006" y="496">required approvals: 0 (by design)</text>
    <text x="1006" y="514">pass → gh pr merge --auto --squash</text>
    <text x="1006" y="532">pass + hitl → label needs-human, wait</text>
    <text x="1006" y="550">squash only · linear history · no force-push</text>
  </g>

  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="495" x2="348" y2="495"/>
    <line x1="600" y1="495" x2="658" y2="495"/>
    <line x1="930" y1="495" x2="988" y2="495"/>
  </g>
  <text x="300" y="488" font-size="11" fill="#4b5563">ticket id</text>
  <text x="612" y="488" font-size="11" fill="#4b5563">PR url</text>
  <text x="940" y="488" font-size="11" fill="#4b5563">verdict</text>

  <!-- fail loop -->
  <path d="M 795 560 L 795 600 L 475 600 L 475 562" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="520" y="594" font-size="12" fill="#b91c1c">fail → new dev attempt (max N) → then blocked + notify</text>

  <!-- guards -->
  <rect x="60" y="625" width="1280" height="95" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="76" y="650" font-size="14" font-weight="700" fill="#9a3412">GUARDS — hooks in every agent session (exit 2 = blocked, never bypassed)</text>
  <g font-size="12" fill="#7c2d12">
    <text x="76" y="674">pre-push-guard: no push to main, no force-push</text>
    <text x="76" y="694">pre-commit-quality: typecheck · lint · test before any commit</text>
    <text x="520" y="674">dep-guard: no new or major dependency without a human</text>
    <text x="520" y="694">protected-paths: ios/ android/ .github/ release config</text>
    <text x="960" y="674">deny-secrets: .env, keys, service accounts never read</text>
    <text x="960" y="694">notify: Stop / SubagentStop → ntfy or Telegram</text>
  </g>

  <!-- RELEASE lane -->
  <rect x="40" y="770" width="1320" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="60" y="798" font-size="15" font-weight="700" fill="#5b21b6">RELEASE — one human click</text>
  <g font-size="13" fill="#2e1065">
    <rect x="60" y="820" width="230" height="70" rx="8" fill="#ddd6fe"/><text x="72" y="845" font-weight="600">release-please</text><text x="72" y="864">keeps a Release PR from</text><text x="72" y="880">Conventional Commits on main</text>
    <rect x="330" y="820" width="200" height="70" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="342" y="845" font-weight="600">You merge it</text><text x="342" y="864">after /release-prepare</text><text x="342" y="880">audits hitl approvals</text>
    <rect x="570" y="820" width="180" height="70" rx="8" fill="#ddd6fe"/><text x="582" y="845" font-weight="600">tag vX.Y.Z</text><text x="582" y="864">created with App token</text><text x="582" y="880">so workflows fire</text>
    <rect x="790" y="820" width="260" height="70" rx="8" fill="#ddd6fe"/><text x="802" y="845" font-weight="600">release workflow</text><text x="802" y="864">protected environment · secrets</text><text x="802" y="880">never visible to agents</text>
    <rect x="1090" y="820" width="250" height="70" rx="8" fill="#ddd6fe"/><text x="1102" y="845" font-weight="600">store</text><text x="1102" y="864">EAS build + submit, or Fastlane</text><text x="1102" y="880">TestFlight / Play internal</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="855" x2="328" y2="855"/><line x1="530" y1="855" x2="568" y2="855"/><line x1="750" y1="855" x2="788" y2="855"/><line x1="1050" y1="855" x2="1088" y2="855"/>
  </g>

  <!-- lane connectors -->
  <g stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#arrowGreen)">
    <line x1="865" y1="324" x2="865" y2="378"/>
    <line x1="1165" y1="560" x2="1165" y2="622"/>
    <line x1="175" y1="720" x2="175" y2="768"/>
  </g>
  <text x="875" y="358" font-size="11" fill="#15803d">approved tickets</text>
  <text x="1175" y="600" font-size="11" fill="#15803d">merge to main</text>
  <text x="185" y="752" font-size="11" fill="#15803d">commits on main</text>
</svg>
